[tool.poetry]
name = "mit-learn-api-clients"
version = "2026.1109.1"
description = ""
authors = []
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
bumpver = "^2023.1129"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.bumpver]
current_version = "2026.1109.1"
# 2026.1109.0, then 2026.1109.1 for a second client the same day. Month and
# zero-padded day share the minor so the patch can count the day's clients:
# npm orders by semver, and the old YYYY.MM.DD[-INC0] made a second same-day
# client (2026.11.9-1) a prerelease that sorted below the first.
version_pattern = "YYYY.MM0D.INC0"
commit = false
tag = false
push = false

[tool.bumpver.file_patterns]
"pyproject.toml" = [
    '^current_version = "{version}"',
    '^version = "{version}"',
]
"src/typescript/mit-learn-api-axios/package.json" = [
    '"version": "{version}"',
]
"VERSION" = [
    "^{version}",
]
