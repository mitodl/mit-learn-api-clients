name: CI - Axios TypeScript Package

on:
  push:
    branches: [main]
  # Every PR, not just ones touching the package: this is the required check that shows
  # the generated client still builds, and a path-filtered required check never reports.
  pull_request:
    branches: [main]

permissions: {}

jobs:
  test-axios-package:
    name: Test Axios TypeScript Package
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        working-directory: src/typescript/mit-learn-api-axios
        run: yarn install --immutable

      - name: Run pack dry-run
        working-directory: src/typescript/mit-learn-api-axios
        run: yarn pack --dry-run
